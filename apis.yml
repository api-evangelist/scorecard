aid: scorecard
name: Scorecard
description: >-
  Scorecard is a simulation and evaluation platform for building, testing, and
  deploying frontier AI agents. Teams run their agents through thousands of
  realistic scenarios, judge outputs with configurable AI, human, and heuristic
  metrics, and ship new capabilities with confidence. The platform organizes
  work into Projects, Testsets, Testcases, Metrics, Runs, Records, Scores, and
  Systems, and exposes a REST API (bearer API keys prefixed ak_) plus official
  Python, TypeScript/Node, and Go SDKs, a hosted MCP server, tracing
  integrations for LangChain, the Vercel AI SDK, and the Claude Agent SDK, and a
  GitHub Actions integration for evals in CI. Scorecard was founded to solve AI
  agent evaluation at scale and is backed by Kindred Ventures.
